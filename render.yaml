services:
  - type: web
    name: inventory-brix
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SCHEMA
        value: coffee_inventory
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-brix-db
          property: connectionString

databases:
  - name: inventory-brix-db
    databaseName: inventory_coffee
    user: inventory_brix
